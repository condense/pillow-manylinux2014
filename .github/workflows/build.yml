name: Build Pillow manylinux2014 wheels

# Builds Pillow wheels for glibc 2.17 (manylinux2014 / manylinux_2_17), which
# upstream stopped publishing in 12.3.0 (python-pillow/Pillow#9528).  Reuses
# Pillow's own cibuildwheel setup and dependency build script unchanged apart
# from patches/, so the bundled libjpeg/libtiff/libwebp/... are the same
# current versions upstream ships.

on:
  workflow_dispatch:
    inputs:
      pillow_version:
        description: "Pillow release to build (git tag on python-pillow/Pillow)"
        required: true
        default: "13.0.0"
      build:
        description: "cibuildwheel build selector"
        required: true
        default: "cp311-manylinux_x86_64 cp312-manylinux_x86_64"
      publish:
        description: "Attach wheels to a GitHub Release named after the Pillow version"
        type: boolean
        default: true

permissions:
  contents: write

env:
  FORCE_COLOR: 1

jobs:
  build:
    name: Build ${{ inputs.pillow_version }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repo (patches)
        uses: actions/checkout@v4
        with:
          path: tooling
          persist-credentials: false

      - name: Check out Pillow ${{ inputs.pillow_version }}
        uses: actions/checkout@v4
        with:
          repository: python-pillow/Pillow
          ref: ${{ inputs.pillow_version }}
          submodules: true
          path: pillow
          persist-credentials: false

      - name: Apply manylinux2014 patches
        working-directory: pillow
        run: git apply --verbose ../tooling/patches/*.patch

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install cibuildwheel (version pinned by Pillow)
        run: python -m pip install -r pillow/.ci/requirements-cibw.txt

      # before-all / test-command / config-settings come from Pillow's
      # pyproject.toml [tool.cibuildwheel]; only the image is overridden.
      # Pillow's test-requires pulls in numpy, which stopped publishing
      # manylinux2014 wheels after 2.2.x; building it from source fails on the
      # image's GCC 10.2. PIP_ONLY_BINARY makes pip fall back to the newest
      # numpy with a glibc 2.17 wheel (2.2.6, which covers cp310-cp313).
      - name: Build wheels
        working-directory: pillow
        run: python -m cibuildwheel --output-dir ../wheelhouse
        env:
          CIBW_PLATFORM: linux
          CIBW_ARCHS: x86_64
          CIBW_BUILD: ${{ inputs.build }}
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux2014
          CIBW_ENVIRONMENT_LINUX: PIP_ONLY_BINARY=numpy
          CIBW_ENVIRONMENT_PASS_LINUX: FORCE_COLOR

      - name: Verify wheel tags are glibc 2.17
        run: |
          ls -l wheelhouse
          for w in wheelhouse/*.whl; do
            case "$(basename "$w")" in
              *manylinux_2_17_x86_64*|*manylinux2014_x86_64*) ;;
              *) echo "::error::unexpected platform tag: $w"; exit 1 ;;
            esac
          done

      # Independent check with the runtime the servers actually use: a
      # uv-managed python-build-standalone interpreter, inside a glibc 2.17
      # container (the manylinux2014 image is CentOS 7).
      - name: Smoke test on glibc 2.17 with a uv-managed Python
        run: |
          docker run --rm -v "$PWD/wheelhouse:/wheelhouse:ro" -v "$PWD/tooling/smoke_test.py:/smoke_test.py:ro" \
            quay.io/pypa/manylinux2014_x86_64 bash -euc '
              ldd --version | head -1
              /opt/python/cp312-cp312/bin/python -m pip install -q uv
              export UV_PYTHON_INSTALL_DIR=/tmp/uvpy UV_CACHE_DIR=/tmp/uvcache
              for w in /wheelhouse/*.whl; do
                tag=$(basename "$w" | cut -d- -f3)          # cp311
                ver="${tag#cp}"; ver="${ver:0:1}.${ver:1}"   # 3.11
                /opt/python/cp312-cp312/bin/uv venv -q -p "$ver" /tmp/venv-$tag
                /opt/python/cp312-cp312/bin/uv pip install -q -p /tmp/venv-$tag/bin/python "$w"
                /tmp/venv-$tag/bin/python /smoke_test.py
              done'

      - name: Checksums
        working-directory: wheelhouse
        run: sha256sum *.whl | tee SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: pillow-${{ inputs.pillow_version }}-manylinux2014
          path: wheelhouse/*

      - name: Publish GitHub Release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.pillow_version }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Pillow $TAG (manylinux2014)" \
              --notes "Pillow $TAG rebuilt for glibc 2.17 (manylinux2014) from the upstream tag with the patches in this repo. Built by run $GITHUB_RUN_ID."
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber wheelhouse/*.whl wheelhouse/SHA256SUMS
